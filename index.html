
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    
    <!-- iOS 專用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI熱量追蹤">
    <link rel="apple-touch-icon" href="https://josh710519.github.io/icons/icon-192.png">
    
    <title>Gemini AI 熱量追蹤器</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Chart.js (用於圖表) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 使用 Inter 字體 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* iOS 底部安全區域修正 */
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 隱藏 Scrollbar 但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .loading-dot {
            animation: bounce 1s infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }
        
        /* 彈窗背景 - 增加模糊質感 */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* 按鈕點擊效果 */
        .btn-press {
            transition: transform 0.1s ease-in-out;
        }
        .btn-press:active {
            transform: scale(0.96);
        }
        
        /* 自訂核取方塊樣式 */
        .custom-checkbox:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen text-gray-800"> 

    <div id="app" class="max-w-md mx-auto pb-32">
        
        <!-- 置頂導航列 (毛玻璃效果) -->
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100/50 px-6 py-4 transition-all duration-300">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2">
                        <span class="text-2xl">🥗</span> FoodCC
                    </h1>
                </div>
                
                <div class="flex items-center gap-3">
                    <!-- 登入狀態顯示 (簡化版) -->
                    <div id="authSection" class="hidden">
                        <div id="userInfo" class="flex items-center gap-2">
                             <!-- 登入後顯示小頭像或狀態 -->
                             <span id="userDisplayName" class="hidden text-xs font-semibold text-gray-600">User</span>
                        </div>
                    </div>

                    <button onclick="showProfileModal(true)" class="btn-press w-10 h-10 flex items-center justify-center bg-white rounded-full text-gray-500 hover:text-blue-600 hover:bg-blue-50 border border-gray-100 shadow-sm transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-6 space-y-6 mt-4">

            <!-- 儀表板區塊 (Widget 風格) -->
            <section id="dashboardSection" class="relative overflow-hidden bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl shadow-xl shadow-blue-500/20 text-white p-6">
                <!-- 裝飾背景圓圈 -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                <div class="absolute bottom-0 left-0 w-32 h-32 bg-indigo-500/30 rounded-full blur-2xl"></div>
                
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-blue-100 text-xs font-bold uppercase tracking-wider mb-1">今日剩餘額度</p>
                            <h2 id="remainingCalories" class="text-5xl font-black tracking-tighter tabular-nums">...</h2>
                        </div>
                        <!-- 小進度環或裝飾 (可選) -->
                        <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-black/20 backdrop-blur-md rounded-2xl p-3 border border-white/5">
                            <p class="text-[10px] text-blue-100 font-medium mb-1">已攝取</p>
                            <p id="todayTotal" class="text-lg font-bold tabular-nums">0</p>
                        </div>
                        <div class="bg-black/20 backdrop-blur-md rounded-2xl p-3 border border-white/5">
                            <p class="text-[10px] text-blue-100 font-medium mb-1">每日目標</p>
                            <p id="calorieTarget" class="text-lg font-bold tabular-nums">...</p>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- 圖表區塊 (獨立卡片) -->
            <section class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100/50">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-gray-800">熱量趨勢</h3>
                    <span class="text-xs text-gray-400 font-medium">近 7 天</span>
                </div>
                <div id="chartContainer" class="relative h-48 w-full">
                    <canvas id="calorieChart"></canvas>
                </div>
            </section>

            <!-- 快捷操作按鈕 -->
            <section class="grid grid-cols-2 gap-4">
                <button onclick="document.getElementById('cameraInput').click()" 
                        class="btn-press group relative overflow-hidden bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-3 hover:border-blue-200 hover:shadow-md transition-all">
                    <div class="bg-blue-50 text-blue-600 p-3 rounded-2xl group-hover:scale-110 transition-transform duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">拍攝食物</span>
                </button>
                <button onclick="document.getElementById('fileInput').click()" 
                        class="btn-press group relative overflow-hidden bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-3 hover:border-indigo-200 hover:shadow-md transition-all">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-2xl group-hover:scale-110 transition-transform duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>
                    <span class="font-bold text-gray-700 text-sm">相簿選取</span>
                </button>
            </section>

            <input type="file" id="cameraInput" accept="image/*" capture="camera" class="hidden" onchange="previewImage(event)">
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="previewImage(event)">

            <!-- 預覽與分析區塊 -->
            <div id="imagePreviewContainer" class="hidden bg-white p-4 rounded-3xl shadow-sm border border-gray-100 animate-fade-in">
                <div class="relative rounded-2xl overflow-hidden mb-4 bg-gray-100">
                    <img id="imagePreview" class="w-full h-64 object-cover" alt="上傳圖片預覽">
                </div>
                <button onclick="analyzeFood()" id="analyzeButton" 
                    class="btn-press w-full py-4 px-6 rounded-2xl font-bold text-white bg-gray-900 hover:bg-black transition shadow-lg shadow-gray-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <span>開始分析</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>

            <!-- 分析結果區塊 -->
            <section id="resultsSection" class="hidden bg-white p-5 rounded-3xl shadow-lg border border-gray-100/50">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <span>✨ 分析結果</span>
                        <span id="loadingIndicator" class="hidden flex space-x-1">
                            <span class="loading-dot w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                            <span class="loading-dot w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                            <span class="loading-dot w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                        </span>
                    </h2>
                    <div id="totalCaloriesDisplay" class="hidden bg-green-50 text-green-700 px-3 py-1 rounded-full text-sm font-bold border border-green-100">
                        <span id="totalCaloriesValue">0</span> kcal
                    </div>
                </div>

                <div id="analysisResult" class="space-y-3 mb-6"></div>
                
                <!-- 建議按鈕 -->
                <div id="adviceContainer" class="hidden mb-4">
                    <button onclick="getNutritionalAdvice()" id="getAdviceButton" 
                        class="btn-press w-full py-3 px-4 rounded-xl text-sm font-bold text-purple-600 bg-purple-50 hover:bg-purple-100 border border-purple-100 transition flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                        取得 AI 營養建議
                    </button>
                    <div id="adviceResult" class="mt-3 hidden p-4 bg-gray-50 rounded-xl border border-gray-100 text-sm text-gray-600 leading-relaxed"></div>
                </div>

                <!-- 地點 -->
                <div class="mb-4 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="text-gray-400 text-lg">📍</span>
                    </div>
                    <input type="text" id="mealLocation" class="block w-full pl-10 pr-4 py-3 bg-gray-50 border-0 rounded-xl text-sm font-medium text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 transition" placeholder="在那裡用餐？ (選填)">
                </div>

                <button onclick="saveMeal()" id="saveButton"
                    class="btn-press w-full py-4 rounded-2xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-200 transition disabled:opacity-50">
                    確認儲存
                </button>
                <p id="saveMessage" class="text-xs text-center mt-3 text-gray-400 font-medium min-h-[1.25rem]"></p>
            </section>

            <!-- 歷史記錄區塊 -->
            <section class="pb-10">
                <div class="flex justify-between items-end mb-4 px-1">
                    <h2 class="text-lg font-bold text-gray-800">歷史記錄</h2>
                    <span class="text-xs font-semibold text-gray-400 bg-gray-100 px-2 py-1 rounded-lg">最近 50 筆</span>
                </div>
                <div id="pastMealsList" class="space-y-3">
                    <p id="historyLoading" class="text-center text-gray-400 py-8 text-sm">正在同步雲端資料...</p>
                </div>
            </section>
        </main>
        
        <div id="messageBox" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-5 py-3 bg-gray-900/90 backdrop-blur-md text-white rounded-full shadow-2xl hidden transition-all duration-300 z-[60] flex items-center gap-3 text-sm font-medium border border-white/10"></div>
    </div>

    <!-- 個人資料彈窗 (Refined Modal) -->
    <div id="profileModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-white w-full max-w-sm p-6 rounded-[2rem] shadow-2xl transform transition-all max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xl font-bold text-gray-900">個人設定</h2>
                <button onclick="hideProfileModal()" id="closeProfileModalButton" class="p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto no-scrollbar flex-grow space-y-6 py-2">
                <!-- 登入卡片 -->
                <div id="profileLoginSection" class="bg-gray-900 rounded-2xl p-5 text-white shadow-lg shadow-gray-300">
                    <p class="text-sm text-gray-300 mb-3 font-medium">登入以同步並保護您的資料</p>
                    <button id="googleSignInButton" onclick="signInWithGoogle()" 
                            class="btn-press w-full py-3 px-4 rounded-xl font-bold text-gray-900 bg-white hover:bg-gray-100 transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                        Google 帳號登入
                    </button>
                    <p id="googleSignInMessage" class="text-xs text-gray-400 text-center mt-2 h-4"></p>
                </div>

                <form id="profileForm" class="space-y-4">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">身體數值設定</h3>
                    
                    <div class="space-y-4">
                        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                            <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">暱稱</label>
                            <input type="text" id="nickname" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0 placeholder-gray-300" placeholder="您的稱呼">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">性別</label>
                                <select id="gender" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0">
                                    <option value="male">男性</option>
                                    <option value="female">女性</option>
                                </select>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 focus-within:ring-2 focus-within:ring-blue-500">
                                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">年齡</label>
                                <input type="number" id="age" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0 placeholder-gray-300" placeholder="歲">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 focus-within:ring-2 focus-within:ring-blue-500">
                                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">身高 (cm)</label>
                                <input type="number" id="height" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0 placeholder-gray-300" placeholder="0">
                            </div>
                            <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 focus-within:ring-2 focus-within:ring-blue-500">
                                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">體重 (kg)</label>
                                <input type="number" id="weight" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0 placeholder-gray-300" placeholder="0">
                            </div>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                            <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">每週活動量</label>
                            <select id="activityLevel" class="w-full bg-transparent border-0 p-0 text-gray-900 font-bold focus:ring-0 text-sm">
                                <option value="1.2">久坐 (辦公室工作)</option>
                                <option value="1.375">輕度 (1-3天/週)</option>
                                <option value="1.55">中度 (3-5天/週)</option>
                                <option value="1.725">高度 (6-7天/週)</option>
                                <option value="1.9">極度 (勞力/運動員)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Delete Account Section -->
                    <div id="deleteAccountSection" class="pt-4 mt-6 hidden">
                        <button type="button" onclick="deleteUserAccount()" class="w-full py-3 px-4 text-red-500 bg-red-50 rounded-xl hover:bg-red-100 font-bold text-sm transition">
                            永久刪除帳號
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="pt-4 mt-2">
                <button type="button" onclick="saveUserProfile()" class="btn-press w-full py-4 px-6 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 font-bold shadow-lg shadow-blue-200 transition">
                    儲存設定
                </button>
            </div>
        </div>
    </div>

    <!-- 資料衝突彈窗 -->
    <div id="mergeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-white w-full max-w-xs p-6 rounded-[2rem] shadow-2xl text-center">
            <div class="bg-yellow-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">資料衝突</h3>
            <p class="text-sm text-gray-500 mb-6">此帳號已有雲端資料。您要如何處理目前的暫存記錄？</p>
            <div class="space-y-3">
                <button type="button" onclick="overwriteWithAnonymousData()" class="btn-press w-full py-3 bg-gray-900 text-white rounded-xl font-bold shadow-lg">
                    保留本機 (覆蓋雲端)
                </button>
                <button type="button" onclick="discardAnonymousData()" class="btn-press w-full py-3 bg-white border border-gray-200 text-gray-700 rounded-xl font-bold">
                    使用雲端 (捨棄本機)
                </button>
            </div>
        </div>
    </div>
    
    <!-- 編輯餐點彈窗 (Immersive) -->
    <div id="editMealModal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden">
        <!-- iOS Sheet 風格 -->
        <div class="bg-white w-full h-full sm:h-auto sm:max-h-[90vh] sm:max-w-md sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden animate-slide-up">
            
            <!-- 圖片區塊 -->
            <div class="relative h-72 shrink-0 bg-gray-900">
                <img id="editMealImage" src="" alt="餐點圖片" class="w-full h-full object-cover opacity-90">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                
                <!-- 關閉按鈕 -->
                <button type="button" id="closeEditModalButton" class="absolute top-6 right-6 p-2 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-full text-white/90 border border-white/10 transition z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>

                <!-- 標題 -->

        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                        canvas.height = (img.width > MAX_WIDTH) ? img.height * scaleSize : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        resolve({ base64: compressedBase64.split(',')[1], mimeType: 'image/jpeg', displayUrl: compressedBase64 });
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        async function callGeminiAPI(base64Image, mimeType) {
            const apiKey = "AIzaSyCN7hEfzCMfN6WkCpo30MtAO_a-2FblCKo"; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: "請詳細分析這張圖片中的所有食物。所有食物名稱嚴格使用繁體中文。只回傳 JSON 格式的結果。" }, { inlineData: { mimeType: mimeType, data: base64Image } }] }],
                systemInstruction: { parts: [{ text: "你是一位精準的營養學家。根據圖片，識別所有食物。重點：所有食物名稱必須翻譯成繁體中文。對於每個食物，估算其名稱和總熱量（kcal）以及估計份量（以公克 'g' 為單位）。" }] },
                generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { foodItems: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, estimated_calories: { type: "NUMBER" }, estimated_quantity_g: { type: "NUMBER" } }, required: ["name", "estimated_calories", "estimated_quantity_g"] } } }, required: ["foodItems"] } }
            };
            
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error((await response.json()).error.message);
            return JSON.parse((await response.json()).candidates?.[0]?.content?.parts?.[0]?.text).foodItems;
        }
        
        async function callGeminiTextAPI(mealData) {
            const apiKey = "AIzaSyCN7hEfzCMfN6WkCpo30MtAO_a-2FblCKo"; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: `食物清單：${JSON.stringify(mealData)}。請用繁體中文給出一段簡短的營養總結和改進建議。` }] }],
                systemInstruction: { parts: [{ text: "你是一位友善且鼓勵人心的營養師。回覆要簡潔、正面。" }] },
                generationConfig: { responseMimeType: "text/plain" }
            };
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            return (await response.json()).candidates?.[0]?.content?.parts?.[0]?.text.trim();
        }

        function calculateTDEE(p) {
            if (!p.age || !p.height || !p.weight) return 2000;
            let bmr = (p.gender === 'male' ? (10*p.weight + 6.25*p.height - 5*p.age + 5) : (10*p.weight + 6.25*p.height - 5*p.age - 161));
            return Math.round(bmr * parseFloat(p.activityLevel));
        }
        
        function updateDashboardUI() {
            const remaining = dailyCalorieTarget - todaysTotalCalories;
            const el = document.getElementById('remainingCalories');

            document.getElementById('calorieTarget').textContent = dailyCalorieTarget.toFixed(0);
            el.className = `text-5xl font-black tracking-tighter tabular-nums ${remaining < 0 ? 'text-red-200' : 'text-white'}`;
        }
        
        function updateChart(mealData) {
            const ctx = document.getElementById('calorieChart').getContext('2d');
            const labels = [], mealsByDay = new Map();
            const today = new Date(); today.setHours(0,0,0,0);
            
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today); d.setDate(today.getDate() - i);
                const str = d.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
                labels.push(str); mealsByDay.set(str, []); 
            }
            
            todaysTotalCalories = 0; 
            mealData.forEach(meal => {
                if (meal.CreatedAt && meal.TotalCalories) {
                    const d = meal.CreatedAt.toDate();
                    const str = d.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
                    if (mealsByDay.has(str)) mealsByDay.get(str).push(meal);
                    const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
                    if (dOnly.getTime() === today.getTime()) todaysTotalCalories += meal.TotalCalories;
                }
            });
            updateDashboardUI();

            const datasets = [];
            let maxMeals = 0; mealsByDay.forEach(m => maxMeals = Math.max(maxMeals, m.length));

            for (let i = 0; i < maxMeals; i++) {
                const data = labels.map(l => (mealsByDay.get(l)[i]?.TotalCalories || 0));
                datasets.push({ label: '餐點', data: data, backgroundColor: getRandomColor(), borderRadius: 4, barPercentage: 0.6 });
            }
            // 目標線
            datasets.push({ label: '目標', data: labels.map(() => dailyCalorieTarget), type: 'line', borderColor: '#E5E7EB', borderDash: [5, 5], borderWidth: 2, pointRadius: 0, fill: false });

            if (myChart) { myChart.data.labels = labels; myChart.data.datasets = datasets; myChart.update(); }
            else {
                myChart = new Chart(ctx, { type: 'bar', data: { labels, datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', padding: 12, cornerRadius: 8, callbacks: { label: (ctx) => { if(ctx.dataset.type==='line') return null; const m = mealsByDay.get(ctx.label)[ctx.datasetIndex]; return `${m?.Name || '餐點'}: ${m?.TotalCalories.toFixed(0)} kcal`; } } } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { borderDash: [2, 4], color: '#f3f4f6' } } } } });
            }
        }

                    <div class="flex justify-between items-start mb-3">
                        <p class="font-bold text-gray-800">${i.Name}</p>
                        <span class="font-black text-gray-900">${i.CaloriesPerServing?.toFixed(0)} <span class="text-xs font-normal text-gray-500">kcal</span></span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="bg-white p-2 rounded-xl border border-gray-100 flex flex-col">
                            <span class="text-[10px] text-gray-400 uppercase font-bold pl-1">份量 (g)</span>
                            <input type="number" id="qty-${i.id}" value="${i.Quantity||0}" class="w-full font-bold text-gray-800 bg-transparent border-0 p-1 focus:ring-0" data-cal-per-gram="${i.CaloriesPerGram||0}" oninput="recalculateItemCalories('${i.id}')">
                        </div>
                         <div class="bg-white p-2 rounded-xl border border-gray-100 flex flex-col">
                            <span class="text-[10px] text-gray-400 uppercase font-bold pl-1">熱量 (kcal)</span>
                            <input type="number" id="cals-${i.id}" value="${i.CaloriesPerServing?.toFixed(0)}" class="w-full font-bold text-gray-800 bg-transparent border-0 p-1 focus:ring-0">
                        </div>
                    </div>
                    <div class="flex justify-end gap-2">
                         <button onclick="deleteMealItem('${i.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 transition">刪除</button>
                         <button onclick="updateMealItem('${i.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 transition">更新</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-400 text-sm">無細項資料</p>';
        }

        document.getElementById('closeEditModalButton').onclick = () => document.getElementById('editMealModal').classList.add('hidden');
        document.getElementById('closeProfileModalButton').onclick = hideProfileModal; // Fixed: Use global function

        // Re-implement helper functions to ensure modal works
        window.recalculateItemCalories = (id) => {
            const qty = parseFloat(document.getElementById(`qty-${id}`).value);
            const rate = parseFloat(document.getElementById(`qty-${id}`).dataset.calPerGram);
            if (!isNaN(qty) && !isNaN(rate)) document.getElementById(`cals-${id}`).value = (qty * rate).toFixed(0);
        }
        
        window.updateMealItem = async (id) => {
            const qty = parseFloat(document.getElementById(`qty-${id}`).value);
            const cals = parseFloat(document.getElementById(`cals-${id}`).value);
            await updateDoc(doc(db, `/artifacts/${appId}/users/${userId}/FoodItems`, id), { Quantity: qty, CaloriesPerServing: cals, CaloriesPerGram: (qty>0?cals/qty:0) });
            recalculateTotalCalories(currentEditingMealId); showMessage('已更新', false);
        }
        
        window.updateMealLocation = async () => {
             await updateDoc(doc(db, `/artifacts/${appId}/users/${userId}/Meals`, currentEditingMealId), { Location: document.getElementById('editMealLocation').value });
             showMessage('地點已更新', false);
        }

        window.deleteMealItem = async (id) => {
            await deleteDoc(doc(db, `/artifacts/${appId}/users/${userId}/FoodItems`, id));
            document.getElementById(`edit-item-${id}`).remove(); recalculateTotalCalories(currentEditingMealId); showMessage('已刪除', false);
        }

        async function recalculateTotalCalories(mid) {
            const snap = await getDocs(query(collection(db, `/artifacts/${appId}/users/${userId}/FoodItems`), where("MealId", "==", mid)));
            const total = snap.docs.reduce((s, d) => s + (d.data().CaloriesPerServing||0), 0);
            await updateDoc(doc(db, `/artifacts/${appId}/users/${userId}/Meals`, mid), { TotalCalories: total });
        }

        window.deleteEntireMeal = async () => {
            const batch = writeBatch(db);
            batch.delete(doc(db, `/artifacts/${appId}/users/${userId}/Meals`, currentEditingMealId));
            (await getDocs(query(collection(db, `/artifacts/${appId}/users/${userId}/FoodItems`), where("MealId", "==", currentEditingMealId)))).forEach(d => batch.delete(d.ref));
            await batch.commit();
            document.getElementById('editMealModal').classList.add('hidden'); showMessage('記錄已刪除', false);
        }

        window.signInWithGoogle = async () => {
            if (auth.currentUser?.isAnonymous) anonymousUserIdBeforeSignIn = auth.currentUser.uid;
            try { await signInWithPopup(auth, new GoogleAuthProvider()); showMessage('登入成功', false); }
            catch (e) { 
                if (e.code === 'auth/credential-already-in-use') { googleCredentialForMerge = GoogleAuthProvider.credentialFromError(e); document.getElementById('mergeModal').classList.remove('hidden'); }
                else showMessage(`登入失敗: ${getFriendlyErrorMessage(e)}`, true); 
            }
        }
        
        window.overwriteWithAnonymousData = async () => {
             document.getElementById('mergeModal').classList.add('hidden'); showMessage('覆蓋資料中...', false);
             try {
                 const cred = await signInWithCredential(auth, googleCredentialForMerge);
                 await deleteAllUserData(cred.user.uid);
                 await copyUserData(anonymousUserIdBeforeSignIn, cred.user.uid);
                 window.location.reload();
             } catch(e) { showMessage('失敗', true); }
        }
        
        window.discardAnonymousData = async () => {
            document.getElementById('mergeModal').classList.add('hidden');
            await signInWithCredential(auth, googleCredentialForMerge);
            window.location.reload();
        }

        window.deleteUserAccount = async () => {
            if (!confirm("確定刪除帳號？無法復原！")) return;
            try { await deleteAllUserData(userId); await deleteUser(auth.currentUser); alert('帳號已刪除'); window.location.reload(); }
            catch(e) { showMessage('刪除失敗，請重新登入後再試', true); }
        }

        function updateAuthUI(user) {
            const authSec = document.getElementById('authSection');
            if (user && !user.isAnonymous) {
                document.getElementById('userDisplayName').textContent = user.displayName || 'User';
                document.getElementById('userDisplayName').classList.remove('hidden');
                authSec.classList.remove('hidden');
                document.getElementById('profileLoginSection').classList.add('hidden');
                document.getElementById('deleteAccountSection').classList.remove('hidden');
            } else {
                authSec.classList.add('hidden');
                document.getElementById('profileLoginSection').classList.remove('hidden');
                document.getElementById('deleteAccountSection').classList.add('hidden');
            }
        }

        window.onload = initFirebase;
        async function initFirebase() {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app); auth = getAuth(app);
            onAuthStateChanged(auth, async (u) => {
                 if (isHandlingConflict) return;
                 if (mealSubscription) mealSubscription();
                 let curr = u;
                 if (!curr) { try { curr = (await signInAnonymously(auth)).user; } catch(e){} }
                 userId = curr.uid; updateAuthUI(curr); loadUserProfile(curr); mealSubscription = subscribeToMealsAndData(userId);
            });
        }
    </script>

    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
    </script>
</body>
</html>
